name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Validate normalized competitive data
        run: npm run data:validate
      - name: Run Node tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official card parser dependency
        run: python -m pip install lxml==6.1.1
      - name: Test public data collectors and card pool preservation
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build frontend and Worker output
        run: npm run build
