name: Update tournament data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tournament-data-update
  cancel-in-progress: false

jobs:
  update:
    # Paused for the GitHub migration: the payload builder requires ignored
    # advisor/card/price snapshots. A fresh runner would erase public card data.
    # Re-enable only after the full updater passes a tracked-only clone check.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci
      - name: Update only public competitive sources
        run: npm run data:update
      - name: Validate normalized records
        run: npm run data:validate
      - name: Build static site data
        run: npm run build
      - name: Commit only real data changes
        run: |
          if git diff --quiet; then
            echo "No tournament data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/competitive web/data/competitive web/app-data.json web/app-data.js web/home-data.json web/assets/rights-manifest.json
          git commit -m "chore(data): update competitive tournament data"
          git push
