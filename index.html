  <body data-theme="wing-zero">
    <script>
      try {
        const savedTheme = localStorage.getItem("gundam-tactical-theme-id");
        const validThemes = ["wing-zero", "epyon", "unicorn", "barbatos", "kshatriya", "gquuuuuux", "aile"];
        if (validThemes.includes(savedTheme)) document.body.dataset.theme = savedTheme;
      } catch (error) {
        document.body.dataset.theme = "wing-zero";
      }
    </script>
    <div id="root"></div>
    <script type="module">
      const analyticsHostname = window.location.hostname.toLowerCase();
      const analyticsDomainMatches = analyticsHostname === "tcgtd.com.br" || analyticsHostname.endsWith(".tcgtd.com.br");
      if (analyticsDomainMatches && !document.getElementById("cloudflare-web-analytics")) {
        const analyticsBeacon = document.createElement("script");
        analyticsBeacon.id = "cloudflare-web-analytics";
        analyticsBeacon.type = "module";
        analyticsBeacon.src = "https://static.cloudflareinsights.com/beacon.min.js";
        analyticsBeacon.dataset.cfBeacon = JSON.stringify({ token: "b49cb96df929424ba248963b28a38ce7" });
